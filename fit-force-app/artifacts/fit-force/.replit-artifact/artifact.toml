kind = "mobile"
previewPath = "/"
title = "Fit Force"
version = "1.0.0"
id = "artifacts/fit-force"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23252

[services.development]
run = "pnpm --filter @workspace/fit-force run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fit-force", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fit-force", "run", "serve" ]

[services.env]
PORT = "23252"
BASE_PATH = "/"
